[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# 데이터 파일은 자주 바뀌지 않지만 빌드마다 새로 쓰이므로 짧게 캐시한다
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# README 그림을 이미지 CDN으로 줄여 받는다 (src/lib/modCard.js의 imgSrc)
[images]
  remote_images = [
    "https://raw\\.githubusercontent\\.com/.*",
    "https://github\\.com/.*",
    "https://user-images\\.githubusercontent\\.com/.*",
    "https://private-user-images\\.githubusercontent\\.com/.*",
  ]

# 옛 주소(netlify.app)는 mods.guide로 보낸다 (같은 내용이 두 주소에 뜨지 않게)
[[redirects]]
  from = "https://cc-mod-guide.netlify.app/*"
  to = "https://mods.guide/:splat"
  status = 301
  force = true
